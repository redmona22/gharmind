services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gharmind
      POSTGRES_PASSWORD: gharmind
      POSTGRES_DB: gharmind
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports: ["5433:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  server:
    build: ./server
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gharmind:gharmind@db:5432/gharmind
      DATABASE_URL_APP: postgresql+psycopg://gharmind_app:gharmind_app@db:5432/gharmind
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  dbdata: